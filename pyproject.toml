[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zkml-bench"
version = "0.1.0"
description = "Benchmark suite for evaluating neural networks on the accuracy vs. ZK proving cost Pareto frontier"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1,<3.0",
    "torchvision>=0.16,<1.0",
    "onnx>=1.14,<2.0",
    "onnxruntime>=1.16,<2.0",
    "onnxscript>=0.1",
    "numpy>=1.24,<2.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "psutil>=5.9",
    "anthropic>=0.20",
]

[project.optional-dependencies]
ezkl = ["ezkl>=9.0,<10.0"]
dev = ["pytest>=7.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
zkml-bench = "zkml_bench.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
